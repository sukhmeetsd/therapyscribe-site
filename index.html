<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TherapyScribe — Coming Soon</title>
<meta name="description" content="Session notes that never leave your Mac. Launching soon.">
<style>
  :root {
    --leaf: #6fcf97; --mist: #cfe8d9; --glow: #a8e6c3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, #1d3a2a 0%, #0e1f17 60%);
    color: #e9f5ee; display: flex; flex-direction: column; align-items: center;
    min-height: 100%; overflow-x: hidden; padding: 48px 20px;
  }
  .leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .leaf {
    position: absolute; top: -5vh; font-size: 18px; opacity: .35;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }
  main { position: relative; z-index: 1; text-align: center; max-width: 560px; }
  .badge {
    display: inline-block; font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--leaf); border: 1px solid rgba(111,207,151,.4); border-radius: 999px;
    padding: 5px 16px; margin-bottom: 22px;
  }
  h1 { font-size: 40px; letter-spacing: -.02em; line-height: 1.1; }
  h1 span { color: var(--leaf); }
  .sub { color: var(--mist); opacity: .85; margin: 14px auto 26px; font-size: 17px; line-height: 1.6; }
  .cta {
    display: inline-block; background: var(--leaf); color: #0e1f17; font-weight: 700;
    text-decoration: none; padding: 12px 26px; border-radius: 10px; margin-bottom: 56px;
    transition: transform .15s ease;
  }
  .cta:hover { transform: translateY(-2px); }
  .game-title { font-size: 14px; color: var(--mist); opacity: .7; margin-bottom: 14px; }
  .board {
    display: grid; grid-template-columns: repeat(4, 72px); gap: 10px; justify-content: center;
    perspective: 700px;
  }
  .card {
    width: 72px; height: 72px; cursor: pointer; position: relative;
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.3,1.2);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 12px; display: flex;
    align-items: center; justify-content: center; font-size: 30px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .back {
    background: linear-gradient(145deg, #1d3a2a, #142b1f);
    border: 1px solid rgba(168,230,195,.18);
  }
  .back::after { content: "🌲"; font-size: 20px; opacity: .35; }
  .front {
    background: linear-gradient(145deg, #234633, #1a3526);
    border: 1px solid rgba(168,230,195,.45); transform: rotateY(180deg);
  }
  .card.matched .front { box-shadow: 0 0 18px rgba(111,207,151,.45); }
  .status { margin-top: 18px; font-size: 14px; color: var(--mist); opacity: .8; min-height: 22px; }
  .win {
    color: var(--glow); font-weight: 600; animation: pop .5s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  button.again {
    margin-top: 10px; background: none; color: var(--leaf); border: 1px solid rgba(111,207,151,.4);
    border-radius: 8px; padding: 7px 18px; font-size: 13px; cursor: pointer;
  }
  button.again:hover { background: rgba(111,207,151,.12); }
  footer { position: relative; z-index: 1; margin-top: auto; padding-top: 48px; font-size: 12px; color: var(--mist); opacity: .5; }
  @media (max-width: 420px) {
    .board { grid-template-columns: repeat(4, 60px); gap: 8px; }
    .card { width: 60px; height: 60px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="leaves" id="leaves"></div>

<main>
  <div class="badge">Coming soon</div>
  <h1>Session notes that<br><span>never leave your Mac.</span></h1>
  <p class="sub">An on-device AI scribe for therapists. No cloud, no account — your clients' words stay between the two of you. Launching soon.</p>
  <a class="cta" href="mailto:sukhmeetsd@gmail.com?subject=TherapyScribe%20early%20access">Get notified at launch</a>

  <p class="game-title">While you're here — find the forest pairs 🌿</p>
  <div class="board" id="board"></div>
  <p class="status" id="status">0 moves</p>
  <button class="again" id="again" hidden>Play again</button>
</main>

<footer>© 2026 · Built on the West Coast 🌲</footer>

<script>
  // drifting leaves background
  const leavesEl = document.getElementById("leaves");
  const glyphs = ["🍃", "🍂", "🌿"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "leaf";
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 9 + Math.random() * 14 + "s";
    s.style.animationDelay = -Math.random() * 20 + "s";
    s.style.fontSize = 12 + Math.random() * 14 + "px";
    leavesEl.appendChild(s);
  }

  // memory match
  const EMOJI = ["🦉", "🍄", "🐿️", "🌲", "🪺", "🦌", "🌧️", "🌙"];
  const board = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const againBtn = document.getElementById("again");
  let first = null, lock = false, moves = 0, matched = 0;

  function setup() {
    board.innerHTML = "";
    first = null; lock = false; moves = 0; matched = 0;
    statusEl.textContent = "0 moves";
    statusEl.classList.remove("win");
    againBtn.hidden = true;
    const deck = [...EMOJI, ...EMOJI].sort(() => Math.random() - 0.5);
    for (const e of deck) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = '<div class="face back"></div><div class="face front">' + e + "</div>";
      card.dataset.v = e;
      card.addEventListener("click", () => flip(card));
      board.appendChild(card);
    }
  }

  function flip(card) {
    if (lock || card.classList.contains("flipped")) return;
    card.classList.add("flipped");
    if (!first) { first = card; return; }
    moves++;
    statusEl.textContent = moves + " move" + (moves === 1 ? "" : "s");
    if (first.dataset.v === card.dataset.v) {
      first.classList.add("matched"); card.classList.add("matched");
      first = null; matched++;
      if (matched === EMOJI.length) {
        statusEl.textContent = "You found the whole forest in " + moves + " moves 🌲✨";
        statusEl.classList.add("win");
        againBtn.hidden = false;
      }
    } else {
      lock = true;
      const a = first; first = null;
      setTimeout(() => { a.classList.remove("flipped"); card.classList.remove("flipped"); lock = false; }, 750);
    }
  }

  againBtn.addEventListener("click", setup);
  setup();
</script>

</body>
</html>
